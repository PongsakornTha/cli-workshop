site_name: Intro to the Command Line
site_description: A beginner-friendly, hands-on command line workshop
# Change these two lines to match your GitHub account/repo
site_url: https://YOUR-USERNAME.github.io/cli-workshop/
repo_url: https://github.com/YOUR-USERNAME/cli-workshop

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy        # copy button on code blocks
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - admonition                 # !!! note / tip / warning boxes
  - pymdownx.details           # ??? collapsible boxes (exercise solutions)
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Workshop: index.md
